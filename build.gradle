plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// GeckoLib: Modrinth Maven (공식 cloudsmith 저장소에 26.2 좌표가 없어 Modrinth 사용)
	exclusiveContent {
		forRepository {
			maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
		}
		filter { includeGroup 'maven.modrinth' }
	}
	// PlayerAnimationLib
	maven { name = 'Redlance'; url = 'https://repo.redlance.org/public' }
}

loom {
	// 클라이언트 전용 코드(src/client)와 공용/서버 코드(src/main)를 컴파일 단계에서 분리
	splitEnvironmentSourceSets()

	mods {
		"huntcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// 자동 시험 (src/gametest): 실제 클라이언트 + 싱글플레이 월드에서 바닐라 속도 · 키 억제 · 조합 입력 확인
	//   ./gradlew runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "huntcraft-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

// 시험 골라 돌리기: -Ponly=Phase3ClientTest,MotionGalleryClientTest   모션 하나만 갤러리: -Pmotion=overhead_slash   판정 도형 끄기: -Pshapes=false
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	if (project.hasProperty('only')) {
		jvmArgs "-Dhuntcraft.only=${project.property('only')}"
	}
	['frames', 'views', 'boss'].each { k ->
		if (project.hasProperty(k)) {
			jvmArgs "-Dhuntcraft.${k}=${project.property(k)}"
		}
	}
	if (project.hasProperty('shapes')) {
		jvmArgs "-Dhuntcraft.shapes=${project.property('shapes')}"
	}
	if (project.hasProperty('motion')) {
		jvmArgs "-Dhuntcraft.motion=${project.property('motion')}"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:geckolib:${project.geckolib_modrinth_id}"
	implementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_anim_version}"
}

// 판정 데이터 목록 (huntcraft/defs/index.txt) — 보스를 더하면 파일만 넣으면 됨 (코드에 목록을 적지 않음)
def defsIndexDir = layout.buildDirectory.dir('generated/defsIndex')
tasks.register('generateDefsIndex') {
	def src = file('src/main/resources/huntcraft/defs')
	inputs.dir(src)
	outputs.dir(defsIndexDir)
	doLast {
		def out = defsIndexDir.get().file('huntcraft/defs/index.txt').asFile
		out.parentFile.mkdirs()
		def lines = []
		src.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			if (f.name.endsWith('.json')) {
				lines << src.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
			}
		}
		out.text = lines.sort().join('\n') + '\n'
	}
}
sourceSets.main.resources.srcDir(defsIndexDir)
processResources.dependsOn('generateDefsIndex')
// 소스 jar 도 생성된 index 를 담으므로 먼저 만들어야 함
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn('generateDefsIndex') }

processResources {
	// 공개 배포판: -PnoMusic 이면 보스 음악 (저작권 — 저장소에도 없음) 을 jar 에서 뺌. 곡은 리소스팩으로 넣으면 재생됨
	if (project.hasProperty('noMusic')) {
		exclude 'assets/huntcraft/sounds/music/**'
	}
	def props = [version: project.version, geckolib_version: project.geckolib_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
	// 몬스터 모델 · 애니메이션 원본은 판정 데이터(defs) 한 벌 — GeckoLib 이 읽는 자리로 복사 (메시 · 텍스처 렌더용)
	// 보스 모델 · 애니메이션 전부 (플레이어 스켈레톤 · 무기 모션은 GeckoLib 이 안 씀)
	from('src/main/resources/huntcraft/defs/skeletons') {
		include '*.geo.json'
		exclude 'hunter.geo.json', 'training_dummy.geo.json', 'swing_rod.geo.json'
		into 'assets/huntcraft/geckolib/models/entity'
	}
	from('src/main/resources/huntcraft/defs/animations') {
		include '*.animation.json'
		exclude 'longsword.animation.json'
		into 'assets/huntcraft/geckolib/animations/entity'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	// MC 26.2 는 Java 25 가 필수 (Java 21 로는 게임 자체가 실행되지 않음)
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
